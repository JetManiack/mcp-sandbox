name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jetmaniack/go-ai-executor

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install esbuild
        run: npm install --global esbuild@0.28.1
      - name: Test
        run: make test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Builds the actual Dockerfile (single amd64 platform, loaded locally,
      # not pushed) and boots it before the real multi-platform push below.
      # `make test` only validates the Go build; it never proves the image this
      # workflow ships actually serves what it's supposed to. This step boots
      # the real image and requests the paths a browser actually requests, so a
      # missing embedded asset fails here instead of in production.
      - name: Smoke test image
        run: |
          docker buildx build --load -t smoke-test:latest .
          docker run -d --name smoke-test -p 18080:8080 -e AUTH_STUB=true smoke-test:latest
          for i in $(seq 1 20); do
            curl -sf http://localhost:18080/livez >/dev/null && break
            sleep 0.5
          done
          fail=0
          for path in /livez /readyz / /js/app.bundle.js \
              /js/vendor/react.production.min.js \
              /js/vendor/react-dom.production.min.js \
              /fonts/space-grotesk.woff2 \
              /fonts/ibm-plex-sans.woff2 \
              /fonts/jetbrains-mono.woff2 \
              /api/me \
              /api/sandboxes; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:18080$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$path returned $code, want 200"
              fail=1
            fi
          done
          # /mcp must reject an unauthenticated call — a 200 here would mean
          # the bearer-token middleware stopped being wired in.
          mcp_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            "http://localhost:18080/mcp")
          echo "/mcp (no token) -> $mcp_code"
          if [ "$mcp_code" != "401" ]; then
            echo "::error::/mcp returned $mcp_code without a token, want 401"
            fail=1
          fi
          docker logs smoke-test
          docker rm -f smoke-test
          exit $fail

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
