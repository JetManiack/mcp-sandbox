name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install esbuild
        run: npm install --global esbuild@0.28.1

      - name: go vet
        run: go vet ./...

      - name: Test
        run: make test

      # make lint/gosec/govulncheck install the tools with the module's Go
      # toolchain (golangci-lint refuses to run when built with an older Go).
      - name: Lint
        run: make lint

      - name: gosec
        run: make gosec

      - name: govulncheck
        run: make govulncheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: executor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: executor
          POSTGRES_PASSWORD: executor
          POSTGRES_DB: executor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # The storage suite runs against SQLite in the job above; this one
      # re-runs it against Postgres, which is the only way the Postgres
      # code paths (advisory-lock migration, driver-specific SQL) get
      # exercised at all.
      - name: Test storage against Postgres
        env:
          TEST_POSTGRES_DSN: postgres://executor:executor@localhost:5432/executor_test
        run: go test ./internal/storage/... -v
