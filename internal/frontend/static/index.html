<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>go-ai-executor</title>
  <style>
    /* Vendored at build time (see the Makefile's vendor-frontend-fonts target)
       and served from our own origin — no per-visitor request to a third-party
       font CDN, and the app still renders with fallback fonts if this origin is
       the only one reachable. */
    @font-face {
      font-family: "Space Grotesk";
      font-weight: 500 700;
      font-display: swap;
      src: url("/fonts/space-grotesk.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Sans";
      font-weight: 400 600;
      font-display: swap;
      src: url("/fonts/ibm-plex-sans.woff2") format("woff2");
    }
    @font-face {
      font-family: "JetBrains Mono";
      font-weight: 400 500;
      font-display: swap;
      src: url("/fonts/jetbrains-mono.woff2") format("woff2");
    }
    :root {
      --bg: #0b0f1a;
      --surface: #131a2b;
      --terminal-bg: #080b13;
      --border: #232b40;
      --text: #e7eaf2;
      --text-dim: #8891a8;
      --signal: #ffb454;
      --credential: #5cc8ff;
      --revoked: #4a5268;
      --ok: #6bd68a;
      --fail: #f2a6a6;
      --danger: #e05c5c;
      --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 var(--font-body);
    }
    header.site {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.9rem 1.4rem;
      background: #0d1220ee;
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }
    header.site h1 {
      margin: 0;
      font: 600 17px/1 var(--font-display);
      letter-spacing: 0.01em;
      color: #fff;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .spacer { flex: 1; }
    h2.section-title {
      font: 600 20px/1.2 var(--font-display);
      margin: 0 0 1rem;
      color: #fff;
    }
    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.9rem;
      font: 500 13px/1 var(--font-body);
      cursor: pointer;
    }
    button:hover { border-color: var(--credential); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary {
      background: var(--signal);
      color: #201404;
      border-color: var(--signal);
      font-weight: 600;
    }
    button.primary:hover { filter: brightness(1.08); }
    /* The stop button is the only destructive control here, and it kills running
       processes. It reads as destructive rather than sharing the styling of
       "show tokens". */
    button.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #1b0707;
      font-weight: 600;
    }
    button.danger:hover:enabled { filter: brightness(1.08); }
    input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      padding: 0.45rem 0.6rem;
    }
    input:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--credential);
      outline-offset: 1px;
    }
    .callout {
      background: #2a1414;
      border: 1px solid #5a2a2a;
      color: var(--fail);
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      margin-bottom: 1rem;
      font-size: 13px;
    }
    .callout.block-notice { color: var(--signal); border-color: #5a4420; background: #2a2114; }
    .transmission {
      background: #0a0d16;
      border: 1px solid var(--credential);
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      flex-wrap: wrap;
    }
    .transmission .label {
      color: var(--credential);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .transmission code {
      font: 400 13px var(--font-mono);
      color: var(--text);
      word-break: break-all;
    }
    .empty-state {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-dim);
    }
    .nav-tabs { display: flex; align-items: center; gap: 0.3rem; flex: 1; }
    .nav-tabs a {
      color: var(--text-dim);
      text-decoration: none;
      font: 500 12px var(--font-body);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      border: 1px solid transparent;
    }
    .nav-tabs a:hover { color: var(--text); }
    .nav-tabs a.active {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }
    .whoami { font: 400 11px var(--font-mono); color: var(--text-dim); }
    .logout-link {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font: 500 12px var(--font-body);
      cursor: pointer;
      padding: 0.3rem 0.65rem;
    }
    .logout-link:hover { color: var(--text); }
    .back-link {
      display: inline-block;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 1rem;
    }
    .back-link:hover { color: var(--text); }
    .metric { font: 400 11px var(--font-mono); color: var(--text-dim); text-decoration: none; }
    a.metric:hover { color: var(--credential); }
    .metric.dim { color: var(--revoked); }
    .status-badge {
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      width: fit-content;
    }
    .status-badge.ok { background: #17281d; color: var(--ok); }
    .status-badge.error { background: #2a1414; color: var(--fail); }

    /* ---- sandbox list ---- */
    .sandbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.9rem;
    }
    .sandbox-card {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      text-decoration: none;
      color: inherit;
    }
    .sandbox-card:hover { border-color: var(--credential); }
    .beacon-row { display: flex; align-items: center; gap: 0.5rem; }
    .beacon {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--revoked);
      flex-shrink: 0;
    }
    .beacon.active {
      background: var(--signal);
      animation: pulse 2.2s infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .beacon.active { animation: none; }
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(255, 180, 84, 0.45); }
      70%  { box-shadow: 0 0 0 6px rgba(255, 180, 84, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 180, 84, 0); }
    }
    .name { font: 600 15px var(--font-display); color: #fff; }
    .block-summary { font-size: 12px; color: var(--signal); }

    /* ---- terminal ---- */
    .term-header { display: flex; align-items: center; gap: 0.7rem; }
    .term-header h2 { margin-bottom: 0; }
    .stream-status {
      font: 500 11px var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .stream-status.live { color: var(--ok); border-color: #244a30; }
    .stream-status.reconnecting,
    .stream-status.catching-up { color: var(--signal); border-color: #5a4420; }
    .stop-bar {
      display: flex;
      gap: 0.5rem;
      margin: 1rem 0;
    }
    .stop-bar .grow { flex: 1; }
    .terminal {
      background: var(--terminal-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      margin-top: 1rem;
      height: 62vh;
      overflow: auto;
      font: 400 12.5px/1.55 var(--font-mono);
    }
    .term-out {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font: inherit;
      color: var(--text);
    }
    .term-out.stderr { color: var(--fail); }
    /* Command boundaries are what make consecutive commands readable as separate
       things rather than one wall of text. */
    .term-command {
      margin: 0.8rem 0 0.2rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      flex-wrap: wrap;
    }
    .term-command:first-child { margin-top: 0; border-top: none; padding-top: 0; }
    .term-prompt { color: var(--signal); }
    .term-command-text { color: #fff; font-weight: 500; }
    .term-workdir { color: var(--text-dim); }
    .term-clock { margin-left: auto; color: var(--revoked); font-size: 11px; }
    .term-exit { margin: 0.2rem 0 0.4rem; font-size: 11px; color: var(--text-dim); }
    .term-exit.ok { color: var(--ok); }
    .term-exit.fail { color: var(--fail); }
    .term-notice {
      margin: 0.4rem 0;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 11.5px;
      border: 1px dashed var(--border);
      color: var(--text-dim);
    }
    .term-notice.killed, .term-notice.blocked { color: var(--signal); border-color: #5a4420; }
    .term-notice.released { color: var(--ok); border-color: #244a30; }
    /* A gap has to look like a hole in the record, not like more output. */
    .term-notice.gap {
      color: var(--fail);
      border-color: #5a2a2a;
      text-align: center;
      letter-spacing: 0.04em;
    }

    /* ---- agents ---- */
    .dispatch-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .dispatch-bar input { flex: 1; }
    .agent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.9rem;
    }
    .agent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
    }
    .agent-card .status-label { font-size: 11px; color: var(--revoked); }
    .agent-card .status-label.active { color: var(--signal); }
    .agent-card .agent-id {
      display: block;
      font: 400 11px var(--font-mono);
      color: var(--text-dim);
      margin: 0.35rem 0 0.7rem;
      word-break: break-all;
    }
    .agent-card .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .agent-card .actions button { font-size: 12px; padding: 0.35rem 0.6rem; }
    .token-list {
      list-style: none;
      margin: 0.7rem 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .token-list li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font: 400 11px var(--font-mono);
      color: var(--text-dim);
    }
    .token-list li .revoked { color: var(--revoked); }
    .token-list li button { font-size: 11px; padding: 0.2rem 0.45rem; }
    .login-gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      height: 60vh;
      color: var(--text-dim);
    }
    .login-gate a { color: var(--credential); }

    /* ---- tool-call history table ---- */
    .tc-scroll { overflow-x: auto; }
    .tc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .tc-table th {
      text-align: left;
      font: 500 11px/1 var(--font-body);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0.4rem 0.7rem;
      border-bottom: 1px solid var(--border);
    }
    .tc-table td {
      padding: 0.45rem 0.7rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .tc-row { cursor: pointer; }
    .tc-row:hover td { background: var(--surface); }
    .tc-row-open td { background: var(--surface); }
    .tc-tool { font: 400 12px var(--font-mono); color: var(--credential); }
    .tc-detail td { padding: 0; }
    .tc-detail-inner {
      padding: 0.7rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      background: var(--terminal-bg);
      border-bottom: 1px solid var(--border);
    }
    .tc-label {
      display: block;
      font: 500 10px var(--font-body);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-bottom: 0.25rem;
    }
    .tc-json {
      margin: 0;
      font: 400 12px/1.5 var(--font-mono);
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- React and all app code are bundled together by esbuild (npm run build in
       web/). No separate vendor scripts are needed: the bundle is self-contained
       and served from our own origin. -->
  <script src="/js/app.bundle.js"></script>
</body>
</html>
